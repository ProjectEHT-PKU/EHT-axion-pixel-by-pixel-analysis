# The ONE parameter file of the M87* axion experiment. Every scientific value is
# written exactly once; code derives everything else from it (eht_axion/experiment.py).
# Machine paths and execution switches are NOT here (CLI options / .env files).
#
# Two independent inputs and the analysis that combines them:
#   raptor       RAPTOR ray tracing of the BHAC GRMHD flow with the axion field
#   eht_imaging  EHT Paper VII fixed-I polarimetric imaging of the 2017 uvfits data
#   analysis     templates from the RAPTOR images, feature selection on the EHT
#                ensembles, likelihood and limits on c
# Each script reads `shared` plus its own section; the analysis also reads the
# raptor and eht_imaging values it needs.

shared:  # values used by more than one part
  mass_solar: 6500000000.0       # M87* mass (EHT 2018 Paper II, 2025)
  distance_mpc: 16.8
  label_step_tg: 0.1             # GRMHD snapshot label step -> time in t_g
  alphas: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.44]  # gravitational fine-structure constants
  principal_n: 2                 # 211 state: omega = alpha (1 - alpha^2 / (2 n^2))
  image:                         # common sky grid: EHT imaging grid = analysis resampling target
    shape: 64                    # pixels per side
    fov_uas: 120.0               # field of view, microarcseconds (1.875 uas pixels)
    blur_fwhm_uas: 19.0          # circular Gaussian FWHM applied to EHT images ("display19")
                                 # AND to simulated images; an additional matching kernel,
                                 # NOT an effective PSF

raptor:  # simulation input: what determines the ray-traced Stokes images
  camera_fov_rg: 46.2261         # camera width in gravitational radii
  build:                         # RAPTOR setup.sh options
    model: bhac
    metric: mks
    integrator: rk4
    grid: SMR
    polarized: true
    sfc: true
    magnetic_polarity: plus
    sigma_cut: 1.0
    thetae_min: 0.001
    thetae_max: 100.0
    uniform_output: false
  plasma:
    mass_unit_g: 3.0e+25
    r_low: 1.0
    r_high: 1.0
    inclination_degrees: 163.0
    frequency_hz: 230.0e+9
    step_size: 0.005
  snapshots: {start: 1600, stop: 3000, step: 10}   # inclusive GRMHD labels -> 141 snapshots
  response:                      # axion-on images for every alpha and the 16 core phases k*pi/8
    resolution: 100              # pixels per side
    reference_norm: 0.1          # axion field normalisation; templates are per this norm
  background:                    # axion-off (state 0) images used for the GRMHD background
    resolution: 400
  radial_tables:                 # radial-profile CSVs (paths given at run time) and their spin
    low: {spin: 0.9375}
    high: {spin: 0.99}           # intentionally differs from the fluid spin 0.9375
  alpha_table:                   # which radial table each alpha uses
    '0.10': low
    '0.15': low
    '0.20': low
    '0.25': low
    '0.30': low
    '0.35': high
    '0.40': high
    '0.44': high
  grid:                          # raw BHAC grid_mks.in coordinates (core multiplies angles by 2 pi)
    nxlone: [96, 48, 48]
    xprobmin: [0.17395330712343798, 0.0, 0.0]
    xprobmax: [7.824046010856292, 0.5, 1.0]
    hslope: 0.0

eht_imaging:  # observation input: Paper IV/VII method (fixed I, D-term solution, D-term Monte Carlo)
  # Data identity: official HOPS low-band uvfits per day, [file name, sha256].
  # The directory, input receipt, feed-rotation table and official script are given
  # per machine (.env or CLI), see README.
  inputs:
    95: [SR2_M87_2017_095_lo_hops_zbl-dtcal+selfcal.uvfits, a749309931dbaa506b7a1575e1eef49af97b3ea62ded1fa717efadbaa2fdd5b4]
    96: [SR2_M87_2017_096_lo_hops_zbl-dtcal+selfcal.uvfits, 2376a3300ce49e458efc3f4403d98dce62cdd9b045f982f0ed73efd199ef6947]
    100: [SR2_M87_2017_100_lo_hops_zbl-dtcal+selfcal.uvfits, 1987e2e25ed47b90dbc13a2216a131e25fbc5b6a2a807d009e81dc579f766937]
    101: [SR2_M87_2017_101_lo_hops_zbl-dtcal+selfcal.uvfits, 5cf936dce926b5b13a0f39065096da1f836ab52ca95fdfffef581057029e8d5b]
  flux_jy: 0.6                   # compact-flux constraint of the official I workflow
  fsys: 0.005                    # fractional systematic noise
  solve_sites: [AZ, LM, PV]      # D terms solved here
  fixed_sites: [AA, AP, SM, JC]  # already leakage-corrected in the HOPS products
  p_data: {pvis: 1.0, m: 1.0}
  p_reg: {hw: 100.0, ptv: 1.0}
  norm_reg: true
  initial_m: 0.1
  initial_evpa_deg: 0.0
  rounds: 50                     # fiducial P/D alternation rounds
  restart_rounds: [2, 12, 22, 32, 42]   # numerical restart schedule, not paper-mandated
  restart_blur_uas: 20.0
  restart_domain_epsilon: 0.00000001    # I-weighted fractional-P restart stays inside |P/I|<1
  maxit: 500                     # numerical per-call cap, not a Table 6 value
  stop: 0.00000001
  shift_objective_constant: true # drop -sum(data weights)-HW*ln(2) from the objective only
  uv_min: 100000000.0            # exclude zero baselines before the shared gain solve
  uncertainty_draws: 1000        # D-term draws per day (4 days -> 4000 images)
  seed: 20210405
  covariance_ddof: 1
  residual_d_sigma: 0.01         # ehtim cerror convention: 1% SD per real/imag component
  residual_d_convention: per_component_sd

analysis:  # combines both inputs: from simulated images and EHT ensembles to limits on c
  rotation_degrees: 108.0        # rotate simulated images onto the sky
  aperture:                      # 1D observable: intensity-weighted pizza-slice EVPA, 1-degree bins
    window_degrees: 10
    radial_max_fraction: 1.0     # of the image half-FOV (60 uas)
  features:                      # selection of EHT likelihood features (EHT images used as
                                 # reconstructed: Paper VII Sec. 5.2 centring = zero shift)
    mask_mode: intensity-polarization
    intensity_fraction: 0.1      # mean I >= 0.1 max
    polarization_fraction: 0.2   # mean |P| >= 0.2 max
    min_radius_rg: 2.0
    pixel_stride: 5              # 2D: every 5th pixel in x and y
    sector_spacing_degrees: 10   # 1D: one sector every 10 degrees ...
    sector_offset_degrees: 4     # ... starting at 4 degrees
    resultant_min: 0.7           # drop features whose circular resultant length < 0.7
  cloud:                         # cloud amplitude b(alpha) = coefficient (alpha/pivot_alpha)^exponent
    coefficient: 0.03
    pivot_alpha: 0.05
    exponent: 1.75
  background:                    # GRMHD background: pooled MLE scatter of lagged axion-off frames
    lag_frames: 3                # 3 x 10 labels = 3 t_g ~ 26.7 h
  inference:
    phase_count: 64              # marginalised axion phase grid
    coupling_points: 120
    coupling_min: 0.0072992700729927005   # 1/137
    coupling_max: 1000.0
    prior: log-uniform
    credibility: 0.95            # upper limit = this posterior quantile of c
    exposure_hours: 6.0
    day_gap_hours: 24.0
    pair_separation_hours: 120.0
