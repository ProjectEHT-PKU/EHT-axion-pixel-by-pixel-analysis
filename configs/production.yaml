# New producer benchmark, NOT a change or calibration of configs/research.yaml.
# Explicit migration benchmark: MBH=6.2e9 Msun, D=16.8 Mpc, camera=46.2261 Rg.
# All other analysis values are copied unchanged from research.yaml. This profile
# is not evidence of a real scientific run or permission to reuse old outputs.
physical:
  mass_solar: 6200000000.0
  distance_mpc: 16.8
  label_step_tg: 0.1

data:
  alphas: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.44]

image:
  initial_fov_rg: 46.2261  # Explicit new producer benchmark camera, not old research geometry.
  final_fov_rg: 32.6868
  final_shape: 64
  rotation_degrees: 108.0
  gaussian_sigma_rg: 2.16871

aperture:
  weighting: intensity
  window_degrees: 10
  radial_max_rg: 16.3434
  angular_bins: 360

eht:
  topset_size: 1572
  min_radius_rg: 2.0
  intensity_fraction: 0.1
  historical_mask: true
  inherit_2d_mask_in_1d: false
  angular_offset: 4
  covariance_ridge: 0.0

background:
  alpha: 0.3
  source_resolution: 400
  lag_frames: 3
  method: mle

inference:
  phase_count: 64
  coupling_points: 120
  coupling_min: 0.0072992700729927005
  coupling_max: 1000.0
  prior: log-uniform
  principal_n: 2  # First scope: existing model.omega(alpha, 2), no eigenfrequency substitution.
  exposure_hours: 6.0
  day_gap_hours: 24.0
  pair_separation_hours: 120.0

producer:
  build:
    model: bhac
    metric: mks
    integrator: rk4
    grid: SMR
    polarized: true
    sfc: true
    magnetic_polarity: plus
    sigma_cut: 1.0
    thetae_min: 0.001
    thetae_max: 100.0
    uniform_output: false
  plasma:
    mass_unit_g: 3.0e+25
    r_low: 1.0
    r_high: 1.0
    inclination_degrees: 163.0
    frequency_hz: 230.0e+9
    step_size: 0.005
  snapshots:
    start: 1600
    stop: 3000
    step: 10
  response:
    resolution: 100
    phase_count: 16
    reference_norm: 0.1
  background:
    resolution: 400
  radial_tables:
    low: {spin: 0.9375}
    high: {spin: 0.99}
  alpha_table:
    '0.10': low
    '0.15': low
    '0.20': low
    '0.25': low
    '0.30': low
    '0.35': high
    '0.40': high
    '0.44': high
  # Raw grid_mks.in coordinates, before core multiplies angles by 2*pi.
  grid:
    nxlone: [96, 48, 48]
    xprobmin: [0.17395330712343798, 0.0, 0.0]
    xprobmax: [7.824046010856292, 0.5, 1.0]
    hslope: 0.0
