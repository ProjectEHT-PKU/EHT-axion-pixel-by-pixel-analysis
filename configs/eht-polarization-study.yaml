# Purely diagnostic strict chi² cuts; NOT asserted to be paper Top Set cuts.
# Fit metadata are before the last 5 uas restoration, NOT restored-FITS chi².
thresholds: {vis: 2.0, cphase: 2.0, logcamp: 2.0, pvis: 2.0, m: 2.0}
# Paper VII §5.1-inspired ADDITIONAL kernel, NOT final beam/PSF FWHM.
# The native FITS already retain the producer's 5 uas restoration.
additional_blur_fwhm_uas: 19.0
max_shift_pixels: 8
# Fixed observable: 128 uas field, r<=64 uas, 10 degree pizza apertures,
# 360 one-degree centers, existing intensity-weighted Stokes quadrature.
# All variants have unregistered ('raw', already blurred) and I-only registered
# mean maps/curves. The mmap stores blurred, registered native-basis IQUV.
# Variants: all4800, legacy_evpa, datafit_perday, datafit_shared, bestI.
# Empty shared intersections are reported/skipped; cuts are never relaxed.
