[workspace]
name = "eht-axion-analysis"
version = "0.2.0"
description = "Script-only M87* EHT axion research pipeline"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.1,<3"
scipy = ">=1.14,<2"
matplotlib = ">=3.9,<4"
h5py = ">=3.10,<4"
pyyaml = ">=6,<7"
pytest = ">=8,<10"
ruff = ">=0.9,<1"
python-dotenv = ">=1,<2"
[activation.env]
MPLBACKEND = "Agg"
OPENBLAS_NUM_THREADS = "2"
OMP_NUM_THREADS = "2"
PYTHONUNBUFFERED = "1"

# Scientific parameters: experiment.yaml. RAPTOR simulation and EHT imaging are independent
# inputs (RAPTOR tasks need -e raptor-build, EHT imaging -e eht-rebuild); the analysis combines them.
[feature.raptor-build]
platforms = ["linux-64"]

[feature.raptor-build.dependencies]
c-compiler = "*"
make = "*"
gsl = "*"
hdf5 = "*"
pkg-config = "*"
rsync = "*"

[feature.raptor-build.tasks]
raptor-build = { cmd = "python scripts/raptor_build.py", description = "RAPTOR: build the pinned RAPTOR core" }
raptor-generate = { cmd = "python scripts/raptor_generate.py", description = "RAPTOR: plan/run jobs and deliver Stokes cubes" }
raptor-merge = { cmd = "python scripts/raptor_merge.py", description = "RAPTOR: merge job roots of several hosts into delivered cubes" }

[feature.eht-research.dependencies]
astropy = ">=6,<8"

[feature.eht-rebuild.pypi-dependencies]
ehtim = "==1.3.2"

[feature.eht-rebuild.tasks]
eht-reconstruct = { cmd = "python scripts/eht_reconstruct.py", description = "EHT imaging: Paper VII stages I / fiducial, one day per root" }
eht-refine = { cmd = "python scripts/eht_refine.py", description = "EHT imaging: exact convex P refinement and D refits of a fiducial stage (settings: eht_imaging.refine)" }
eht-export-bundle = { cmd = "python scripts/eht_export_bundle.py", description = "EHT imaging: bundle the four I and refined-D stages as the Monte Carlo input" }
eht-sample = { cmd = "python scripts/eht_sample.py", description = "EHT imaging: fixed-D Monte Carlo, one P image per D draw (settings: eht_imaging.monte_carlo)" }

[feature.eht-research.tasks]
eht-summarize = { cmd = "python scripts/eht_summarize.py", description = "EHT imaging: summarize the draws into EHT ensembles for the analysis" }

# Analysis (combines RAPTOR and EHT products) and maintenance tasks; default environment.
[tasks]
analysis-templates = { cmd = "python scripts/analysis_templates.py", description = "Analysis: templates and GRMHD background from delivered RAPTOR data" }
analysis-limits = { cmd = "python scripts/analysis_limits.py", description = "Analysis: feature selection on EHT ensembles, likelihood and limits on c" }
analysis-check-grid = { cmd = "python scripts/analysis_check_grid.py", description = "Analysis: re-evaluate limits on a denser grid / wider prior (CLI overrides)" }
analysis-check-covariance = { cmd = "python scripts/analysis_check_covariance.py", description = "Analysis: split-ensemble covariance sensitivity" }
analysis-summarize = { cmd = "python scripts/analysis_summarize.py", description = "Analysis: summary tables and figures" }
verify = { cmd = "python scripts/verify_products.py", description = "Verify a completed stage: pixi run verify PATH" }
test = { cmd = 'python -m pytest -q -ra -o "testpaths=tests" -o "pythonpath=. scripts"', description = "Run tests; discovery and local source paths are configured here" }
lint = { cmd = "ruff check --isolated --target-version py312 --line-length 110 --select E,F,W eht_axion tests scripts", description = "Check code using explicit rules; no external Ruff configuration" }
check = { depends-on = ["test", "lint"], description = "Run tests and lint" }

[environments]
default = { features = [] }
raptor-build = { features = ["raptor-build"] }
eht-research = { features = ["eht-research"] }
eht-rebuild = { features = ["eht-research", "eht-rebuild"] }
