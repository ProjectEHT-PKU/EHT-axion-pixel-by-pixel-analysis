[workspace]
name = "eht-axion-analysis"
version = "0.2.0"
description = "Script-only M87* EHT axion research pipeline"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.1,<3"
scipy = ">=1.14,<2"
matplotlib = ">=3.9,<4"
h5py = ">=3.10,<4"
pyyaml = ">=6,<7"
pytest = ">=8,<10"
ruff = ">=0.9,<1"
python-dotenv = ">=1,<2"
[activation.env]
MPLBACKEND = "Agg"
OPENBLAS_NUM_THREADS = "2"
OMP_NUM_THREADS = "2"
PYTHONUNBUFFERED = "1"

# Tasks are listed in process order; scientific parameters: experiment.yaml.
# Process 1 (RAPTOR) needs -e raptor-build; process 2 (eht-imaging) -e eht-rebuild.
[feature.raptor-build]
platforms = ["linux-64"]

[feature.raptor-build.dependencies]
c-compiler = "*"
make = "*"
gsl = "*"
hdf5 = "*"
pkg-config = "*"
rsync = "*"

[feature.raptor-build.tasks]
raptor-build = { cmd = "python scripts/raptor_build.py", description = "1.1 Build the pinned RAPTOR core" }
raptor-generate = { cmd = "python scripts/raptor_generate.py", description = "1.2 Plan/run RAPTOR jobs and deliver Stokes cubes" }
raptor-merge = { cmd = "python scripts/raptor_merge.py", description = "1.3 Merge job roots of several hosts into delivered cubes" }

[feature.eht-research.dependencies]
astropy = ">=6,<8"

[feature.eht-rebuild.pypi-dependencies]
ehtim = "==1.3.2"

[feature.eht-rebuild.tasks]
eht-reconstruct = { cmd = "python scripts/eht_reconstruct.py", description = "2.1 Paper VII imaging: --stage I / fiducial / uncertainty, one day per root" }
eht-refine = { cmd = "python scripts/eht_refine.py", description = "2.2 Exact convex P refinement of a fiducial/draw" }
eht-refine-d = { cmd = "python scripts/eht_refine_d.py", description = "2.3 D-term tolerance study on top of eht-refine" }
eht-sample = { cmd = "python scripts/eht_sample.py", description = "2.4 Fixed-D Monte Carlo: one P image per D draw (4 x 1000)" }

[feature.eht-research.tasks]
eht-summarize = { cmd = "python scripts/eht_summarize.py", description = "2.5 Summarize the draws into EHT ensembles for the analysis" }

# Process 3 (analysis) and maintenance tasks; default environment.
[tasks]
analysis-templates = { cmd = "python scripts/analysis_templates.py", description = "3.1 Templates and GRMHD background from delivered RAPTOR data" }
analysis-limits = { cmd = "python scripts/analysis_limits.py", description = "3.2 Feature selection, likelihood and limits on c" }
analysis-check-grid = { cmd = "python scripts/analysis_check_grid.py", description = "3.3 Re-evaluate limits on a denser grid / wider prior (CLI overrides)" }
analysis-check-covariance = { cmd = "python scripts/analysis_check_covariance.py", description = "3.4 Split-ensemble covariance sensitivity" }
analysis-summarize = { cmd = "python scripts/analysis_summarize.py", description = "3.5 Summary tables and figures" }
verify = { cmd = "python scripts/verify_products.py", description = "Verify a completed stage: pixi run verify PATH" }
test = { cmd = 'python -m pytest -q -ra -o "testpaths=tests" -o "pythonpath=. scripts"', description = "Run tests; discovery and local source paths are configured here" }
lint = { cmd = "ruff check --isolated --target-version py312 --line-length 110 --select E,F,W eht_axion tests scripts", description = "Check code using explicit rules; no external Ruff configuration" }
check = { depends-on = ["test", "lint"], description = "Run tests and lint" }

[environments]
default = { features = [] }
raptor-build = { features = ["raptor-build"] }
eht-research = { features = ["eht-research"] }
eht-rebuild = { features = ["eht-research", "eht-rebuild"] }
