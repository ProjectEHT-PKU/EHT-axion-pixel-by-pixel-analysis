[workspace]
name = "eht-axion-analysis"
version = "0.2.0"
description = "Script-only M87* EHT axion research pipeline"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.1,<3"
scipy = ">=1.14,<2"
matplotlib = ">=3.9,<4"
h5py = ">=3.10,<4"
pyyaml = ">=6,<7"
pytest = ">=8,<10"
ruff = ">=0.9,<1"
[activation.env]
MPLBACKEND = "Agg"
OPENBLAS_NUM_THREADS = "2"
OMP_NUM_THREADS = "2"
PYTHONUNBUFFERED = "1"

[tasks]
help = { cmd = "python scripts/run_all.py --help", description = "Show direct-script configuration and path options" }
migrate = { cmd = "python scripts/migrate_data.py", description = "Create canonical input/run layout without modifying original data" }
verify = { cmd = "python scripts/verify_products.py", description = "Verify a completed stage: pixi run verify PATH" }
pipeline = { cmd = "python scripts/run_all.py", description = "Run research stages in sequence; no installed package or unified CLI" }
raptor = { cmd = "python scripts/process_raptor.py", description = "Preprocess RAPTOR Stokes, fit response and summarize templates" }
eht = { cmd = "python scripts/process_eht.py", description = "Process EHT image ensembles (requires --trust-pickle)" }
background = { cmd = "python scripts/estimate_background.py", description = "Estimate intrinsic GRMHD background from state0" }
observations = { cmd = "python scripts/build_observations.py", description = "Construct selected day differences and covariance" }
inference = { cmd = "python scripts/calculate_limits.py", description = "Compute six limits from cached physical products" }
figures = { cmd = "python scripts/plot_limits.py", description = "Plot six curves from numerical results" }
diagnostics = { cmd = "python scripts/plot_diagnostics.py", description = "Plot intermediate physical diagnostics" }
convergence = { cmd = "python scripts/check_convergence.py", description = "Check coupling and phase grid convergence" }
transport = { cmd = "python scripts/transport_diagnostics.py", description = "Figure-4 transport diagnostics" }
convert-hdf5 = { cmd = "python scripts/raptor_tools.py convert", description = "Convert explicitly mapped HDF5 Stokes datasets" }
compare = { cmd = "python scripts/compare_original_limits.py", description = "Compare saved original and new null limit curves" }
test = { cmd = 'python -m pytest -q -ra -o "testpaths=tests" -o "pythonpath=. scripts"', description = "Run tests; discovery and local source paths are configured here" }
lint = { cmd = "ruff check --isolated --target-version py312 --line-length 110 --select E,F,W eht_axion tests scripts", description = "Check code using explicit rules; no external Ruff configuration" }
check = { depends-on = ["test", "lint"], description = "Run tests and lint" }

[environments]
default = { features = [] }
