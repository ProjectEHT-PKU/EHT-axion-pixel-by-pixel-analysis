[workspace]
name = "eht-axion-analysis"
description = "Script-only M87* EHT axion analysis"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.1,<3"
scipy = ">=1.14,<2"
matplotlib = ">=3.9,<4"
h5py = ">=3.10,<4"
pyyaml = ">=6,<7"
pytest = ">=8,<10"
ruff = ">=0.9,<1"
python-dotenv = ">=1,<2"
[activation.env]
MPLBACKEND = "Agg"
OPENBLAS_NUM_THREADS = "2"
OMP_NUM_THREADS = "2"
PYTHONUNBUFFERED = "1"

# Scientific parameters: configs/experiment.yaml. RAPTOR simulation and EHT imaging are independent
# inputs (RAPTOR tasks need -e raptor-build, EHT imaging -e eht-imaging, the EHT ensemble
# summary -e eht-summary); the analysis combines them.
[feature.raptor-build]
platforms = ["linux-64"]

[feature.raptor-build.dependencies]
c-compiler = "*"
make = "*"
gsl = "*"
hdf5 = "*"
pkg-config = "*"
rsync = "*"

[feature.raptor-build.tasks]
raptor-build = { cmd = "python scripts/raptor/build.py", description = "RAPTOR: build the pinned RAPTOR core" }
raptor-generate = { cmd = "python scripts/raptor/generate.py", description = "RAPTOR: plan/run jobs and write the Stokes image cubes" }

[feature.eht-summary.dependencies]
astropy = ">=6,<8"

[feature.eht-imaging.pypi-dependencies]
ehtim = "==1.3.2"

[feature.eht-imaging.tasks]
eht-reconstruct = { cmd = "python scripts/eht/reconstruct.py", description = "EHT imaging: Paper VII stages I / fiducial, one day per root" }
eht-refine = { cmd = "python scripts/eht/refine.py", description = "EHT imaging: exact convex P refinement and D refits of a fiducial stage (settings: eht_imaging.refine)" }
eht-sample = { cmd = "python scripts/eht/sample.py", description = "EHT imaging: fixed-D Monte Carlo, one P image per D draw (settings: eht_imaging.monte_carlo)" }

[feature.eht-summary.tasks]
eht-summarize = { cmd = "python scripts/eht/summarize.py", description = "EHT imaging: summarize the draws into EHT ensembles for the analysis" }

# Analysis (combines RAPTOR and EHT products) and maintenance tasks; default environment.
[tasks]
analysis-expected-signal = { cmd = "python scripts/analysis/expected_signal.py", description = "Analysis: expected axion signal and GRMHD background from the RAPTOR images" }
analysis-constraints = { cmd = "python scripts/analysis/constraints.py", description = "Analysis: feature selection on EHT ensembles, likelihood and constraints on c" }
analysis-paper = { cmd = "python scripts/analysis/paper.py", description = "Analysis: figures, numbers.tex/json and tables used by the paper" }
test = { cmd = 'python -m pytest -q -ra -o "testpaths=tests" -o "pythonpath=."', description = "Run tests; discovery and local source paths are configured here" }
lint = { cmd = "ruff check --isolated --target-version py312 --line-length 110 --select E,F,W eht_axion tests scripts", description = "Check code using explicit rules; no external Ruff configuration" }
check = { depends-on = ["test", "lint"], description = "Run tests and lint" }

[environments]
default = { features = [] }
raptor-build = { features = ["raptor-build"] }
eht-summary = { features = ["eht-summary"] }
eht-imaging = { features = ["eht-summary", "eht-imaging"] }
